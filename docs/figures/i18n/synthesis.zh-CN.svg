<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820" role="img" aria-labelledby="title description" xml:lang="zh-CN">
  <title id="title">可复现的合成拍摄图生成流程</title>
  <desc id="description">用单应变换放置原始 X 光片。固定种子或分层控制在生成照片前确定底片占幅、缺损、背景、拍摄介质和外观；几何模式可随占幅而变化。几何过程同时生成完整片幅有序四角、可见片区掩码和宽高比标签。约 20% 的配方直接保留原图。本示意图不含患者影像。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10Z" fill="#5b6e80" />
    </marker>
    <linearGradient id="source" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#dce5eb" />
      <stop offset="1" stop-color="#667988" />
    </linearGradient>
    <style>
      .bg{fill:#f7f9fc}.card{fill:#fff;stroke:#c4d0dc;stroke-width:2}.sub{fill:#eff5f9;stroke:#d6e0e9;stroke-width:1.5}
      .ink{fill:#18324c;font-family:'Noto Sans CJK SC','Noto Sans CJK',sans-serif}.muted{fill:#52677b;font-family:'Noto Sans CJK SC','Noto Sans CJK',sans-serif}
      .h1{font-size:31px;font-weight:700}.h2{font-size:20px;font-weight:700}.body{font-size:17px}.small{font-size:14px}
      .blue{fill:#1c658e}.teal{fill:#096f66}.amber{fill:#985d13}
      .line{fill:none;stroke:#5b6e80;stroke-width:3;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect class="bg" width="1600" height="820" />
  <text class="ink h1" x="55" y="60">可复现的合成拍摄图</text>
  <text class="muted body" x="55" y="94">场景与真值同步生成；配方概率是设计目标，不等于实际频率</text>
  <line x1="55" y1="116" x2="1545" y2="116" stroke="#c8d4df" stroke-width="2" />
  <rect class="card" x="55" y="150" width="290" height="228" rx="15" />
  <text class="ink h2" x="78" y="185">参考底片</text>
  <text class="muted small" x="78" y="208">完整原片画布及尺寸</text>
  <rect x="129" y="224" width="142" height="122" rx="5" fill="url(#source)" stroke="#50687a" stroke-width="2" />
  <path d="M150 249 Q198 229 247 250 M154 274 Q195 260 249 278 M159 306 Q198 288 245 312" fill="none" stroke="#eaf1f5" stroke-width="8" opacity=".35" />
  <path class="line" d="M345 265 H405" />
  <rect class="card" x="410" y="150" width="290" height="228" rx="15" />
  <text class="ink h2" x="433" y="185">透视放置</text>
  <text class="muted small" x="433" y="208">已知原片→照片单应变换</text>
  <rect x="466" y="226" width="178" height="121" rx="4" fill="#d9e7ed" stroke="#b2c5d1" stroke-width="2" />
  <path d="M489 255 L607 235 L625 327 L506 335 Z" fill="url(#source)" stroke="#1c658e" stroke-width="3" />
  <circle cx="489" cy="255" r="5" fill="#1c658e" />
  <circle cx="607" cy="235" r="5" fill="#1c658e" />
  <circle cx="625" cy="327" r="5" fill="#1c658e" />
  <circle cx="506" cy="335" r="5" fill="#1c658e" />
  <path class="line" d="M700 265 H760" />
  <rect class="card" x="765" y="150" width="290" height="228" rx="15" />
  <text class="ink h2" x="788" y="185">合成拍摄画面</text>
  <text class="muted small" x="788" y="208">应用五类场景控制</text>
  <rect class="sub" x="790" y="226" width="240" height="121" rx="8" />
  <path d="M809 305 L930 243 L1007 295 L887 338 Z" fill="#d8e8ec" stroke="#7796a5" stroke-width="2" />
  <path d="M811 297 L927 238 L1003 290" fill="none" stroke="#1c658e" stroke-width="5" />
  <path d="M841 324 L876 310 M961 274 L989 291" fill="none" stroke="#ab7130" stroke-width="4" />
  <text class="muted small" x="796" y="366">几何、介质与拍摄外观</text>
  <path class="line" d="M1055 265 H1115" />
  <rect class="card" x="1120" y="150" width="425" height="228" rx="15" />
  <text class="ink h2" x="1143" y="185">合成手机照片</text>
  <text class="muted small" x="1143" y="208">固定场景种子生成的一张图</text>
  <rect x="1168" y="224" width="148" height="125" rx="5" fill="#344e5e" />
  <path d="M1190 260 L1277 239 L1298 315 L1204 327 Z" fill="url(#source)" stroke="#d9e8ee" stroke-width="2" />
  <path d="M1190 260 L1277 239 L1298 315 L1204 327 Z" fill="none" stroke="#e4f1f5" stroke-width="1" />
  <path d="M1182 245 H1302 M1182 334 H1302" stroke="#7294a5" stroke-width="2" opacity=".7" />
  <text class="muted small" x="1341" y="259">可见原片</text>
  <text class="muted small" x="1341" y="282">＋周围背景</text>
  <text class="muted small" x="1341" y="305">＋拍摄干扰</text>
  <text class="ink h2" x="55" y="426">场景控制与分层</text>
  <text class="muted small" x="339" y="425">渲染前固定种子或分层；几何模式可随占幅变化</text>
  <rect class="card" x="55" y="447" width="278" height="184" rx="13" />
  <rect x="55" y="447" width="278" height="10" rx="5" fill="#1c658e" />
  <text class="ink h2" x="75" y="489">底片占幅</text>
  <text class="muted small" x="75" y="518">底片占照片面积</text>
  <text class="blue body" x="75" y="550">90–98 · 75–90 · 50–75%</text>
  <text class="blue body" x="75" y="578">30–50 · 10–30%</text>
  <text class="muted small" x="75" y="607">目标：20 / 30 / 35 / 10 / 5%</text>
  <rect class="card" x="352" y="447" width="278" height="184" rx="13" />
  <rect x="352" y="447" width="278" height="10" rx="5" fill="#096f66" />
  <text class="ink h2" x="372" y="489">缺损</text>
  <text class="muted small" x="372" y="518">完整片幅中的缺失</text>
  <text class="teal body" x="372" y="550">完整 · 轻度</text>
  <text class="teal body" x="372" y="578">中度 · 较重</text>
  <text class="muted small" x="372" y="607">目标：80 / 12 / 6 / 2%</text>
  <rect class="card" x="649" y="447" width="278" height="184" rx="13" />
  <rect x="649" y="447" width="278" height="10" rx="5" fill="#6c619c" />
  <text class="ink h2" x="669" y="489">背景</text>
  <text class="muted small" x="669" y="518">周围场景</text>
  <text class="body" x="669" y="550" fill="#584d8b" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif">观片界面 · COCO</text>
  <text class="body" x="669" y="578" fill="#584d8b" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif">近色 · 混色</text>
  <text class="muted small" x="669" y="607">目标：40 / 25 / 25 / 10%</text>
  <rect class="card" x="946" y="447" width="278" height="184" rx="13" />
  <rect x="946" y="447" width="278" height="10" rx="5" fill="#985d13" />
  <text class="ink h2" x="966" y="489">介质</text>
  <text class="muted small" x="966" y="518">拍摄表面</text>
  <text class="amber body" x="966" y="550">屏幕或实体胶片</text>
  <text class="muted small" x="966" y="607">独立种子选择介质</text>
  <rect class="card" x="1243" y="447" width="302" height="184" rx="13" />
  <rect x="1243" y="447" width="302" height="10" rx="5" fill="#617587" />
  <text class="ink h2" x="1263" y="489">拍摄外观</text>
  <text class="muted small" x="1263" y="518">拍摄退化</text>
  <text class="body" x="1263" y="550" fill="#415d73" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif">清晰 · 轻度</text>
  <text class="body" x="1263" y="578" fill="#415d73" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif">中度 · 较强</text>
  <text class="muted small" x="1263" y="607">外观另设独立种子</text>
  <rect x="55" y="670" width="1490" height="107" rx="14" fill="#e9f2f5" stroke="#bdd0d9" stroke-width="2" />
  <text class="ink h2" x="80" y="706">照片与真值同步生成</text>
  <text class="muted body" x="80" y="737">全片有序四角（左上／右上／右下／左下） · 可见片区掩码 · 全片宽高比 · 原片到照片的映射</text>
  <text class="muted small" x="80" y="762">约 20% 的配方直接保留原图。公开效果示例仅采用经许可核实的 CC BY 4.0 来源。</text>
</svg>