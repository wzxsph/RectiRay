<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="880" viewBox="0 0 1700 880" role="img" aria-labelledby="title description" xml:lang="zh-CN">
  <title id="title">PTRN V3 几何定位与单次采样取图流程</title>
  <desc id="description">手机照片等比例缩放并补边至 224 像素后，进入具有四级特征的 DenseNet201 编码器。64 通道自顶向下空间融合直接预测有序四角及辅助可见片区掩码。池化编码器特征与四角边长几何共同估计完整片幅比例。从原始照片只采样一次完成展平；掩码不负责第二次裁剪，也不补造缺失的影像。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10Z" fill="#526781" />
    </marker>
    <linearGradient id="photo" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#526270" />
      <stop offset="1" stop-color="#142a40" />
    </linearGradient>
    <linearGradient id="film" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#c9d6de" />
      <stop offset="1" stop-color="#607788" />
    </linearGradient>
    <style>
      .bg{fill:#f7f9fc}.card{fill:#fff;stroke:#c4d0dc;stroke-width:2}.sub{fill:#f0f5fa;stroke:#d4dee8;stroke-width:1.5}
      .ink{fill:#17324d;font-family:'Noto Sans CJK SC','Noto Sans CJK',sans-serif}.muted{fill:#53677d;font-family:'Noto Sans CJK SC','Noto Sans CJK',sans-serif}
      .h1{font-size:32px;font-weight:700}.h2{font-size:20px;font-weight:700}.body{font-size:17px}.small{font-size:14px}
      .blue{fill:#1b658e}.teal{fill:#096f66}.amber{fill:#9c5e11}.line{fill:none;stroke:#526781;stroke-width:3;marker-end:url(#arrow)}
      .thin{fill:none;stroke:#8799aa;stroke-width:2}.pill{fill:#e4f1f7}
    </style>
  </defs>
  <rect class="bg" width="1700" height="880" />
  <text class="ink h1" x="60" y="60">PTRN V3 · 以几何定位恢复 X 光片</text>
  <text class="muted body" x="60" y="94">研究架构 · 在 224 × 224 输入图上预测一次，从原始照片重采样一次</text>
  <line x1="60" y1="118" x2="1640" y2="118" stroke="#c8d4df" stroke-width="2" />
  <rect class="card" x="60" y="160" width="225" height="425" rx="16" />
  <text class="ink h2" x="82" y="198">手机拍摄照片</text>
  <text class="muted small" x="82" y="223">保留原始分辨率</text>
  <rect x="91" y="253" width="163" height="244" rx="8" fill="url(#photo)" />
  <path d="M108 310 L224 282 L239 444 L118 462 Z" fill="url(#film)" stroke="#eaf3f7" stroke-width="3" />
  <path d="M127 345 Q172 310 211 347 M130 373 Q178 342 217 383 M137 408 Q180 381 220 419" fill="none" stroke="#dfe9ee" stroke-width="7" opacity=".38" />
  <circle cx="108" cy="310" r="5" fill="#eaf3f7" />
  <circle cx="224" cy="282" r="5" fill="#eaf3f7" />
  <circle cx="239" cy="444" r="5" fill="#eaf3f7" />
  <circle cx="118" cy="462" r="5" fill="#eaf3f7" />
  <text class="muted small" x="82" y="536">原始像素与拍摄边界</text>
  <text class="muted small" x="82" y="557">均用于最终取图</text>
  <path class="line" d="M285 371 H327" />
  <rect class="card" x="330" y="160" width="205" height="425" rx="16" />
  <text class="ink h2" x="352" y="198">网络输入图</text>
  <text class="muted small" x="352" y="223">等比例缩放并补边</text>
  <rect x="362" y="267" width="140" height="140" rx="6" fill="#13293c" />
  <path d="M379 286 L486 278 L490 392 L382 396 Z" fill="url(#film)" stroke="#e3eff4" stroke-width="2" />
  <path d="M393 326 Q428 307 472 332 M396 355 Q438 340 474 365" fill="none" stroke="#dfe9ee" stroke-width="6" opacity=".35" />
  <text class="ink h2" x="365" y="451">224 × 224 RGB</text>
  <text class="muted small" x="352" y="491">ImageNet 通道归一化</text>
  <text class="muted small" x="352" y="514">保存逆变换</text>
  <path class="line" d="M535 371 H572" />
  <rect class="card" x="575" y="160" width="360" height="425" rx="16" />
  <text class="ink h2" x="598" y="198">DenseNet201 编码器</text>
  <text class="muted small" x="598" y="223">仅训练输出头时冻结编码器和 BatchNorm</text>
  <rect class="sub" x="600" y="248" width="310" height="59" rx="9" />
  <rect x="615" y="261" width="31" height="31" fill="#d6e8f1" stroke="#1b658e" stroke-width="2" />
  <path d="M625 261 V292 M635 261 V292 M615 271 H646 M615 281 H646" stroke="#78a9c5" stroke-width="1" />
  <text class="ink body" x="660" y="273">conv2</text>
  <text class="muted small" x="660" y="293">56 × 56 特征图</text>
  <rect class="sub" x="600" y="321" width="310" height="59" rx="9" />
  <rect x="615" y="334" width="31" height="31" fill="#c4e5e3" stroke="#096f66" stroke-width="2" />
  <path d="M630 334 V365 M615 349 H646" stroke="#74bdb4" stroke-width="1" />
  <text class="ink body" x="660" y="346">conv3</text>
  <text class="muted small" x="660" y="366">28 × 28 特征图</text>
  <rect class="sub" x="600" y="394" width="310" height="59" rx="9" />
  <rect x="615" y="407" width="31" height="31" fill="#d9d7ef" stroke="#62629f" stroke-width="2" />
  <text class="ink body" x="660" y="419">conv4</text>
  <text class="muted small" x="660" y="439">14 × 14 特征图</text>
  <rect class="sub" x="600" y="467" width="310" height="59" rx="9" />
  <rect x="615" y="480" width="31" height="31" fill="#f5e3c7" stroke="#9c5e11" stroke-width="2" />
  <text class="ink body" x="660" y="492">conv5</text>
  <text class="muted small" x="660" y="512">7 × 7 特征图</text>
  <text class="muted small" x="598" y="554">四级特征；池化 conv5 用于比例残差</text>
  <path class="line" d="M935 371 H972" />
  <rect class="card" x="975" y="160" width="286" height="425" rx="16" />
  <text class="ink h2" x="999" y="198">空间特征融合</text>
  <text class="muted small" x="999" y="223">自顶向下，供四角和掩码共用</text>
  <rect class="sub" x="1000" y="263" width="236" height="73" rx="9" />
  <text class="ink body" x="1017" y="292">1 × 1 侧向投影</text>
  <text class="blue small" x="1017" y="316">每级 64 通道</text>
  <path class="line" d="M1118 337 V370" />
  <rect class="sub" x="1000" y="373" width="236" height="73" rx="9" />
  <text class="ink body" x="1017" y="402">上采样＋相加</text>
  <text class="muted small" x="1017" y="426">3 × 3 平滑</text>
  <path class="line" d="M1118 447 V480" />
  <rect class="pill" x="1000" y="483" width="236" height="65" rx="9" />
  <text class="ink body" x="1017" y="509">4 张空间得分图</text>
  <text class="blue small" x="1017" y="532">读出网格 56 × 56</text>
  <path class="line" d="M1261 371 H1298" />
  <rect class="card" x="1300" y="160" width="340" height="425" rx="16" />
  <text class="ink h2" x="1323" y="198">模型的三个输出</text>
  <rect class="sub" x="1324" y="224" width="292" height="99" rx="9" />
  <rect x="1338" y="238" width="7" height="70" rx="3" fill="#1b658e" />
  <text class="ink body" x="1357" y="252">有序四角</text>
  <text class="muted small" x="1357" y="274">线性读出：左上→右上→右下→左下</text>
  <text class="blue small" x="1357" y="296">坐标可越界；不硬截断</text>
  <rect class="sub" x="1324" y="337" width="292" height="99" rx="9" />
  <rect x="1338" y="351" width="7" height="70" rx="3" fill="#096f66" />
  <text class="ink body" x="1357" y="365">完整片幅宽高比</text>
  <text class="muted small" x="1357" y="387">四角边长对数基线＋残差</text>
  <text class="teal small" x="1357" y="409">残差利用池化 conv5 特征</text>
  <rect class="sub" x="1324" y="450" width="292" height="99" rx="9" />
  <rect x="1338" y="464" width="7" height="70" rx="3" fill="#9c5e11" />
  <text class="ink body" x="1357" y="478">可见片区掩码</text>
  <text class="muted small" x="1357" y="500">辅助监督，1 × 1 输出头</text>
  <text class="amber small" x="1357" y="522">不作第二次硬裁剪</text>
  <text class="ink h2" x="60" y="638">取图约定</text>
  <path class="thin" d="M60 654 H1640" />
  <rect class="card" x="60" y="680" width="477" height="150" rx="14" />
  <circle cx="90" cy="714" r="17" fill="#1b658e" />
  <text x="85" y="721" fill="#fff" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="18" font-weight="700">1</text>
  <text class="ink h2" x="118" y="721">映射回原始照片</text>
  <text class="muted body" x="82" y="756">对保存的补边变换求逆；</text>
  <text class="muted body" x="82" y="781">四角仍按照片坐标表示。</text>
  <path class="line" d="M537 755 H585" />
  <rect class="card" x="590" y="680" width="477" height="150" rx="14" />
  <circle cx="620" cy="714" r="17" fill="#096f66" />
  <text x="615" y="721" fill="#fff" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="18" font-weight="700">2</text>
  <text class="ink h2" x="648" y="721">求解可见区域的展平</text>
  <text class="muted body" x="612" y="756">使用四角和全片宽高比；</text>
  <text class="muted body" x="612" y="781">只保留照片实际拍到的部分。</text>
  <path class="line" d="M1067 755 H1115" />
  <rect class="card" x="1120" y="680" width="520" height="150" rx="14" />
  <circle cx="1150" cy="714" r="17" fill="#9c5e11" />
  <text x="1145" y="721" fill="#fff" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="18" font-weight="700">3</text>
  <text class="ink h2" x="1178" y="721">从原图采样一次</text>
  <text class="muted body" x="1142" y="756">按输出分辨率作一次透视采样。</text>
  <text class="amber body" x="1142" y="781">绝不补造缺失影像。</text>
</svg>