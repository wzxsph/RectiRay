[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ptrn-hip"
version = "0.1.0"
description = "Local research: synthetic phone photographs for hip X-ray rectification"
requires-python = ">=3.11,<3.13"
dependencies = [
  "torch>=2.5,<3",
  "keras==3.15.1",
  "h5py>=3.14,<4",
  "opencv-python-headless>=4.13,<5.1",
  "numpy>=2.0,<3",
  "Pillow>=12,<13",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ptrn-hip = "ptrn_hip.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/ptrn_hip", "src/ptrn_pipeline"]
